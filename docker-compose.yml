# Contrat spawn (VibeLab) — cf. ADR-038/ADR-047 :
# réseau externe `proxy`, labels ${APP_NAME}/${DOMAIN} interpolés par spawn,
# pas de ports: publiés. Le middleware d'auth (--auth authentik) est injecté
# par l'override généré par spawn — ne pas le déclarer ici.
services:
  web:
    build: .
    restart: unless-stopped
    networks: [proxy]
    volumes:
      - maturity-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/maturity.db
      # Identité fournie par le proxy Authentik (en-têtes X-authentik-*),
      # rôles applicatifs = groupes maturity-admin / maturity-pilote / maturity-repondant
      - SSO_HEADERS=1
      # Mail : interpolé par spawn (--mail → Mailpit mailer:1025, --mail real → smtp-relay).
      # Le réseau `mail` est attaché par l'override généré par spawn.
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-1025}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.${APP_NAME}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${APP_NAME}.entrypoints=websecure
      - traefik.http.routers.${APP_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${APP_NAME}.loadbalancer.server.port=8000

volumes:
  maturity-data:

networks:
  proxy:
    external: true
