{% extends "base.html" %}
{% block title %}Créer une campagne — Maturité numérique{% endblock %}

{% block content %}
<div style="max-width: 720px;">
    <a class="fr-link fr-icon-arrow-left-line fr-link--icon-left fr-mb-2w" href="{{ url_for('campagnes_list') }}">Campagnes</a>
    <h1 class="fr-mt-1w fr-mb-3w">Créer une campagne</h1>

    <div class="panel">
        <form method="post">
            <div class="fr-input-group fr-mb-3w">
                <label class="fr-label" for="campagne-label">Nom de la campagne</label>
                <input class="fr-input" type="text" id="campagne-label" name="label" required
                       placeholder="ex. Campagne 2026 — Design">
            </div>

            <div class="fr-grid-row fr-grid-row--gutters fr-mb-1w">
                <div class="fr-col-12 fr-col-md-6">
                    <div class="fr-input-group">
                        <label class="fr-label" for="campagne-debut">Date de début</label>
                        <input class="fr-input" type="date" id="campagne-debut" name="date_debut" required>
                    </div>
                </div>
                <div class="fr-col-12 fr-col-md-6">
                    <div class="fr-input-group">
                        <label class="fr-label" for="campagne-fin">Date de fin (optionnelle)</label>
                        <input class="fr-input" type="date" id="campagne-fin" name="date_fin">
                    </div>
                </div>
            </div>

            <div class="fr-select-group fr-mb-4w">
                <label class="fr-label" for="campagne-ref">Référentiel de la campagne
                    <span class="fr-hint-text">Toutes les évaluations de la campagne partageront ce référentiel — garantit la comparabilité.</span>
                </label>
                <select class="fr-select" id="campagne-ref" name="referentiel_id">
                    <option value="" disabled selected>Sélectionner un référentiel</option>
                    {% for ref in referentiels %}
                    <option value="{{ ref.id }}">{{ ref.label }}{% if ref.cible == "site" %} (sites){% endif %}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="fr-btns-group fr-btns-group--inline">
                <button type="submit" class="fr-btn">Créer et définir le périmètre</button>
                <a class="fr-btn fr-btn--tertiary-no-outline" href="{{ url_for('campagnes_list') }}">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
