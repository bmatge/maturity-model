{% extends "base.html" %}
{% block title %}{{ "Modifier" if site else "Créer" }} un site — Maturité numérique{% endblock %}

{% block content %}
<div style="max-width: 640px;">
    <a class="fr-link fr-icon-arrow-left-line fr-link--icon-left" href="{{ url_for('sites_list') }}">Sites web</a>
    <h1 class="fr-mt-1w fr-mb-3w">{{ "Modifier un site" if site else "Créer un site" }}</h1>

    <div class="panel">
        <form method="post">
            <div class="fr-input-group fr-mb-3w">
                <label class="fr-label" for="site-nom">Nom du site</label>
                <input class="fr-input" type="text" id="site-nom" name="nom" required
                       value="{{ site.nom if site else "" }}">
            </div>

            <div class="fr-input-group fr-mb-3w">
                <label class="fr-label" for="site-url">URL</label>
                <input class="fr-input" type="url" id="site-url" name="url" placeholder="https://…"
                       value="{{ site.url or "" if site else "" }}">
            </div>

            <div class="fr-select-group fr-mb-4w">
                <label class="fr-label" for="site-organisation">Organisation de rattachement</label>
                <select class="fr-select" id="site-organisation" name="organisation_id" required>
                    {% if not site %}<option value="" disabled selected>Sélectionner une organisation</option>{% endif %}
                    {% for e in entites %}
                    <option value="{{ e.id }}" {% if site and site.organisation_id == e.id %}selected{% endif %}>{{ e.nom }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="fr-btns-group fr-btns-group--inline">
                <button type="submit" class="fr-btn">Enregistrer</button>
                <a class="fr-btn fr-btn--tertiary-no-outline" href="{{ url_for('sites_list') }}">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
