{% extends "base.html" %}
{% block title %}{{ "Modifier" if entite else "Créer" }} une organisation — Maturité numérique{% endblock %}

{% block content %}
<div style="max-width: 640px;">
    <a class="fr-link fr-icon-arrow-left-line fr-link--icon-left" href="{{ url_for('entites_list') }}">Organisations</a>
    <h1 class="fr-mt-1w fr-mb-3w">{{ "Modifier une organisation" if entite else "Créer une organisation" }}</h1>

    <div class="panel">
        <form method="post">
            <div class="fr-input-group fr-mb-3w">
                <label class="fr-label" for="entite-nom">Nom</label>
                <input class="fr-input" type="text" id="entite-nom" name="nom" required
                       value="{{ entite.nom if entite else "" }}">
            </div>

            <div class="fr-grid-row fr-grid-row--gutters fr-mb-1w">
                <div class="fr-col-12 fr-col-md-6">
                    <div class="fr-select-group">
                        <label class="fr-label" for="entite-type">Type</label>
                        <select class="fr-select" id="entite-type" name="type">
                            <option value="Bureau" {% if entite and entite.type == "Bureau" %}selected{% endif %}>Bureau</option>
                            <option value="SIRCOM" {% if entite and entite.type == "SIRCOM" %}selected{% endif %}>SIRCOM</option>
                        </select>
                    </div>
                </div>
                <div class="fr-col-12 fr-col-md-6">
                    <div class="fr-input-group">
                        <label class="fr-label" for="entite-direction">Direction</label>
                        <input class="fr-input" type="text" id="entite-direction" name="direction"
                               value="{{ entite.direction or "" if entite else "" }}">
                    </div>
                </div>
            </div>

            <div class="fr-input-group fr-mb-4w">
                <label class="fr-label" for="entite-description">Description</label>
                <textarea class="fr-input" id="entite-description" name="description" rows="3">{{ entite.description or "" if entite else "" }}</textarea>
            </div>

            <div class="fr-btns-group fr-btns-group--inline">
                <button type="submit" class="fr-btn">Enregistrer</button>
                <a class="fr-btn fr-btn--tertiary-no-outline" href="{{ url_for('entites_list') }}">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
